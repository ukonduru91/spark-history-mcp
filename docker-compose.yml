# Spark History Server + the TypeScript MCP, ready to run on Docker Desktop.
#
#   docker compose up --build
#
#   Spark History Server UI : http://localhost:18080
#   Spark History REST API  : http://localhost:18080/api/v1/applications
#   MCP (streamable-http)   : http://localhost:18888/mcp
#
# The history server reads the sample event logs in ./examples/basic/events,
# which include two applications generated by the jobs in ./examples/jobs.

services:
  spark-history-server:
    image: docker.io/apache/spark:3.5.5
    container_name: spark-history-server
    ports:
      - "18080:18080"
    volumes:
      - ./examples/basic:/mnt/data:ro
    command:
      - /opt/java/openjdk/bin/java
      - -cp
      - /opt/spark/conf:/opt/spark/jars/*
      - -Xmx1g
      - org.apache.spark.deploy.history.HistoryServer
      - --properties-file
      - /mnt/data/history-server.conf
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:18080/api/v1/applications"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark-mcp:
    build: .
    container_name: spark-mcp
    depends_on:
      spark-history-server:
        condition: service_healthy
    ports:
      - "18888:18888"
    environment:
      SHS_MCP__TRANSPORT: streamable-http
      SHS_MCP__ADDRESS: 0.0.0.0
      SHS_MCP__PORT: "18888"
      SHS_SERVERS__LOCAL__URL: http://spark-history-server:18080
      SHS_SERVERS__LOCAL__DEFAULT: "true"
